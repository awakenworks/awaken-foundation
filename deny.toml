# cargo-deny configuration.
#
# Foundation is permissively licensed and depended on by everything above it, so
# its dependency graph must stay permissive — a copyleft dep here would
# contaminate every consumer. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # The rustls transport graph uses ISC for its crypto/WebPKI components and
    # CDLA-Permissive-2.0 for the public CA dataset. aws-lc-sys also contains
    # MIT-0 code. All three are permissive SPDX licenses; keep them explicit.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
