[package]
name = "awaken-scoped-migration-sqlite"
description = "Synchronous rusqlite backend for the scoped-migration ledger, decoupled from any pinned driver version"
version.workspace = true
edition.workspace = true
# Shares the migration core's driver floor, including cross-driver tests.
rust-version = "1.94"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
categories = ["database"]

[dependencies]
awaken-scoped-migration.workspace = true
# A *range*, deliberately not a hard `^0.x` pin. `rusqlite` pulls the native,
# `links = "sqlite3"` crate `libsqlite3-sys`, of which a dependency graph may
# contain exactly one version. Pinning a single 0.x here is what deadlocks any
# graph that also needs a different rusqlite. The security floor retains a range
# within the audited family while excluding affected bundled SQLite. See ADR-0005.
rusqlite = { version = ">=0.41.1, <0.42", features = ["bundled"] }

[dev-dependencies]
# Cross-driver compatibility: a ledger written by this runner is accepted by the
# sqlx-driven runner in `awaken-scoped-migration` (same tables, same checksums).
awaken-scoped-migration = { workspace = true, features = ["sqlite"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
