# Git hooks, installed via `pnpm hooks:install`.
#
# awaken-foundation is the open, permissively-licensed base tier. The checks
# mirror the family standard; the dependency guardrail (xtask) additionally
# enforces that no foundation crate depends on a product/component above it.

pre-commit:
  parallel: true
  commands:
    trust-roots:
      run: python3 scripts/ci/check_trust_roots.py --self-test && python3 scripts/ci/check_trust_roots.py
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    secrets:
      run: python3 scripts/ci/check_secrets.py {staged_files}
    doc-links:
      glob: "*.md"
      run: python3 scripts/ci/check_doc_links.py {staged_files}
    root-docs:
      run: python3 scripts/ci/check_root_docs.py {staged_files}
    hidden-unicode:
      run: python3 scripts/ci/check_hidden_unicode.py {staged_files}
    file-length:
      run: python3 scripts/ci/check_file_length.py --staged
    adr:
      glob: "docs/adr/*.md"
      run: python3 scripts/ci/check_adr.py {staged_files}
    adr-immutability:
      glob: "docs/adr/*.md"
      run: python3 scripts/ci/check_adr_immutability.py --self-test && python3 scripts/ci/check_adr_immutability.py --staged
    migrations:
      run: python3 hooks/check_migrations.py --self-test && python3 hooks/check_migrations.py --staged

pre-push:
  parallel: false
  commands:
    trust-roots:
      run: python3 scripts/ci/check_trust_roots.py --self-test && python3 scripts/ci/check_trust_roots.py
    msrv:
      # Database drivers use the qualified 1.96 floor; unchanged database-free
      # base crates retain their separately checked 1.88 floor.
      run: |
        cargo +1.96.0 check --workspace --all-targets --all-features --locked
        cargo +1.88.0 check --locked --all-features -p awaken-api-contract -p awaken-connection -p awaken-connection-auth -p awaken-connection-transports -p awaken-query -p xtask
    clippy:
      run: cargo clippy --workspace --all-targets -- -D clippy::correctness
    guardrails:
      run: cargo run -p xtask -- guardrail-lints
    file-length:
      run: python3 scripts/ci/check_file_length.py --self-test && python3 scripts/ci/check_file_length.py
    migrations:
      run: python3 hooks/check_migrations.py --audit
    test:
      run: cargo test --workspace
    coverage:
      run: bash scripts/ci/check-coverage.sh

commit-msg:
  commands:
    commit-shape:
      run: python3 scripts/ci/check_commit_shape.py {1}

post-rewrite:
  commands:
    commit-shape:
      # `use_stdin` forwards git's old->new SHA pairs to the command. Without it
      # lefthook hands the script an empty, never-closed stdin, so
      # `--rewrite-stdin` blocks forever and `git rebase` appears to hang.
      use_stdin: true
      run: |
        if [ "{1}" != "rebase" ]; then
          exit 0
        fi
        python3 scripts/ci/check_commit_shape.py --rewrite-stdin
