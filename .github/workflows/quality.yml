name: Foundation quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - name: Verify immutable shim and patched certificate data
        shell: bash
        run: |
          python3 scripts/ci/check_trust_roots.py --self-test
          python3 scripts/ci/check_trust_roots.py
      - name: Verify the locked native workspace at its declared MSRV
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo run --locked -p xtask -- guardrail-lints
          cargo clippy --workspace --all-features --all-targets --locked -- -D clippy::correctness
          cargo test --workspace --locked
          cargo test --locked -p awaken-scoped-migration --features sqlite

  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - name: Install pinned audit tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.1
      - name: Check the active graph and the complete lockfile
        run: |
          python3 scripts/ci/check_trust_roots.py --self-test
          python3 scripts/ci/check_trust_roots.py --audit
          cargo deny check
